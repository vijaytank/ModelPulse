name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore ModelPulse.slnx

    - name: Build Solution
      run: dotnet build ModelPulse.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test ModelPulse.slnx --configuration Release --no-build --verbosity normal
